name: GitHub release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub release using the reusable workflow
    permissions:
      contents: write  # Required only for the tag-triggered GitHub release creation job.
    uses: ./.github/workflows/reusable_app_release.yml
    if: startsWith(github.ref, 'refs/tags/')
    with:
      app_ref_name: ${{ github.ref_name }}
      app_revision: ${{ github.sha }}
