# Vendored from LedgerHQ/ledger-app-workflows@adb54f0c6a2fa93a7f14764f92ad4d09cc4f192a (v1.106.0).
# External dependencies are locally hardened to immutable revisions.
name: Get app manifest

on:
  workflow_call:
    inputs:
      workflows_ref:
        description: 'The current reference in use for the ledger-app-workflow repository'
        required: true
        type: string
      app_repository:
        description: 'The URL of the app repository to check. Defaults to the workflow caller repository URL'
        required: false
        default: ${{ github.repository }}
        type: string
      run_for_devices:
        description: 'The list of device(s) on which the checking will run'
        required: true
        type: string
      relative_app_directory:
        description: 'The relative path in the repository where the application is built from (defaults to ".")'
        required: false
        default: .
        type: string
      is_rust:
        description: '"true" if the app is using Rust SDK, else "false"'
        required: true
        type: string
      upload_manifest_artifact_name:
        description: 'The name of the artifact containing the built manifest'
        required: true
        type: string
      download_app_binaries_artifact_name:
        description: |
          The name of the artifact containing the built application binaries (one
          'build/<target>/bin/app.elf' per device). When provided, the glyph list
          dumped in the manifest is reduced to the glyphs actually embedded in the
          binary. If empty, the full glyph list is kept (legacy behavior).
        required: false
        default: ''
        type: string

permissions:
  contents: read  # Needed to clone the repositories

env:
  WORKFLOWS_REF: ${{ inputs.workflows_ref }}
  APP_REPOSITORY: ${{ inputs.app_repository }}
  RUN_FOR_DEVICES: ${{ inputs.run_for_devices }}
  RELATIVE_APP_DIRECTORY: ${{ inputs.relative_app_directory }}
  IS_RUST: ${{ inputs.is_rust }}
  UPLOAD_MANIFEST_ARTIFACT_NAME: ${{ inputs.upload_manifest_artifact_name }}

jobs:
  get_app_manifest:
    name: Get application manifest for supported devices
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.run_for_devices) }}
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder@sha256:a823f13dba372213b508870874a2d16dcab898972e212ceb18bab0c44c0c7856

    steps:
      - name: Clone ledger-app-workflows repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: LedgerHQ/ledger-app-workflows
          path: ./ledger-app-workflows
          ref: ${{ inputs.workflows_ref }}
          persist-credentials: false

      - name: Clone app repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.app_repository }}
          path: app-repository
          submodules: recursive
          persist-credentials: false

      - name: Call Cargo metadata dumper script
        if: ${{ inputs.is_rust == 'true'}}
        run: |
            ./ledger-app-workflows/scripts/check_all.sh -r -c manifest -t "${MATRIX_DEVICE}" \
              -a ./app-repository -b "${RELATIVE_APP_DIRECTORY}" \
              -m "../manifest_${MATRIX_DEVICE}.json"
        env:
          MATRIX_DEVICE: ${{ matrix.device }}

      - name: Download app binaries
        # Built once by the reusable_build job and reused here, so glyphs can be filtered
        # down to the ones actually embedded in the binary. continue-on-error: if the build
        # failed upstream the artifact is missing; the dumper step below then fails with an
        # explicit "build the application first" error rather than failing here.
        if: ${{ inputs.is_rust == 'false' && inputs.download_app_binaries_artifact_name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.download_app_binaries_artifact_name }}
          path: app-repository/${{ inputs.relative_app_directory }}/build

      - name: Install ImageMagick
        # Required by makefile_dump.py to extract glyph dimensions
        if: ${{ inputs.is_rust == 'false' }}
        run: ./ledger-app-workflows/scripts/apt_install.sh imagemagick

      - name: Call Makefile dumper script
        if: ${{ inputs.is_rust == 'false'}}
        shell: bash
        run: |
          case "${MATRIX_DEVICE}" in
            nanos|nanox|nanosp|stax|flex|apex_m|apex_p) ;;
            *)
              echo "Unsupported Ledger device: ${MATRIX_DEVICE}" >&2
              exit 1
              ;;
          esac
          sdk_variable="${MATRIX_DEVICE^^}_SDK"
          BOLOS_SDK="${!sdk_variable:-}"
          if [[ -z "${BOLOS_SDK}" ]]; then
            echo "SDK variable ${sdk_variable} is not available." >&2
            exit 1
          fi
          export BOLOS_SDK
          ./ledger-app-workflows/scripts/check_all.sh -c manifest -t "${MATRIX_DEVICE}" \
            -a ./app-repository -b "${RELATIVE_APP_DIRECTORY}" \
            -m "../manifest_${MATRIX_DEVICE}.json"
        env:
          MATRIX_DEVICE: ${{ matrix.device }}

      - name: Upload app manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.upload_manifest_artifact_name }}-${{ matrix.device }}
          path: ./manifest_*.json
          if-no-files-found: error

  merge_artifacts:
    name: Merge build artifacts
    needs: get_app_manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.upload_manifest_artifact_name }}
          pattern: ${{ inputs.upload_manifest_artifact_name }}-*
          delete-merged: true
