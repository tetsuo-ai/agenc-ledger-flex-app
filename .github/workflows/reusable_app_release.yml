# Vendored from LedgerHQ/ledger-app-workflows@adb54f0c6a2fa93a7f14764f92ad4d09cc4f192a (v1.106.0).
# External dependencies are locally hardened to immutable revisions.
name: Build and release Ledger application

on:
  workflow_call:
    inputs:
      app_repository:
        description: 'The GIT repository to release (defaults to `github.repository`)'
        required: false
        default: ${{ github.repository }}
        type: string
      app_ref_name:
        description: 'The exact agenc-flex-v<semver> release tag'
        required: false
        default: ${{ github.ref_name }}
        type: string
      app_revision:
        description: 'The immutable GIT commit to build and release'
        required: false
        default: ${{ github.sha }}
        type: string
      builder:
        description: "The allowlisted Ledger builder profile (defaults to ledger-app-builder-lite)"
        required: false
        default: 'ledger-app-builder-lite'
        type: string

env:
  APP_REPOSITORY: ${{ inputs.app_repository }}
  APP_REF_NAME: ${{ inputs.app_ref_name }}
  APP_REVISION: ${{ inputs.app_revision }}
  BUILDER: ${{ inputs.builder }}

permissions:
  contents: read

jobs:
  call_get_app_metadata:
    # This job digests inputs and repository metadata provided by the `ledger_app.toml` manifest
    # file, in order to output relevant directories, compatible devices, and other variables needed
    # by following jobs.
    name: Retrieve application metadata
    uses: ./.github/workflows/_get_app_metadata.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_revision }}

  check_tag:
    name: Validate AgenC release tag and metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_revision }}
          persist-credentials: false
      - name: Validate release metadata
        id: validate
        shell: bash
        run: |
          if [[ ! "${APP_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: Release builds require an immutable 40-character commit SHA." >&2
            exit 1
          fi
          if [ "${APP_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
            echo "Error: Releases may only build this repository." >&2
            exit 1
          fi

          bash .github/scripts/validate-release-version.sh --metadata \
            "${APP_REF_NAME}" VERSION CHANGELOG.md >> "${GITHUB_OUTPUT}"

  build_app:
    needs: check_tag
    uses: ./.github/workflows/reusable_build.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_revision }}
      builder: ${{ inputs.builder }}
      upload_app_binaries_artifact: 'app_binaries'

  release:
    name: Create GitHub release with verified build artifacts
    needs: [call_get_app_metadata, check_tag, build_app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required to create the validated tag's GitHub release.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_revision }}
          persist-credentials: false

      - name: Download app binaries artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app_binaries
          path: binaries

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "binaries directory structure:"
          find binaries -maxdepth 4 -print | sort

          mkdir release_assets
          shopt -s nullglob
          device_dirs=(binaries/*)
          if (( ${#device_dirs[@]} == 0 )); then
            echo "No device artifacts were downloaded." >&2
            exit 1
          fi
          for device_dir in "${device_dirs[@]}"; do
            device_name=$(basename "$device_dir")
            if [[ ! "${device_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid device artifact directory: ${device_name}" >&2
              exit 1
            fi
            if [ "${NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST}" = 'false' ]; then
              required_assets=(
                'bin/app.elf:elf'
                'bin/app.hex:hex'
                'bin/app.sha256:sha256'
                'dbg/app.map:map'
              )
              for asset_spec in "${required_assets[@]}"; do
                source_path=${asset_spec%%:*}
                extension=${asset_spec##*:}
                if [ ! -f "${device_dir}/${source_path}" ]; then
                  echo "Missing ${source_path} release asset for ${device_name}." >&2
                  exit 1
                fi
                cp -- "${device_dir}/${source_path}" \
                  "release_assets/agenc-solana-${device_name}-v${RELEASE_VERSION}.${extension}"
              done
            else
              rust_app_path=$(find "binaries/${device_name}/release" -type f ! -name '*.*' -print -quit)
              if [ -n "$rust_app_path" ] && [ -f "$rust_app_path" ]; then
                cp -- "$rust_app_path" \
                  "release_assets/agenc-solana-${device_name}-v${RELEASE_VERSION}.elf"
              else
                echo "Missing Rust ELF release asset for ${device_name}." >&2
                exit 1
              fi
            fi
          done

          (
            cd release_assets
            mapfile -t checksum_files < <(
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' |
                LC_ALL=C sort
            )
            if (( ${#checksum_files[@]} == 0 )); then
              echo "No release assets were produced." >&2
              exit 1
            fi
            sha256sum -- "${checksum_files[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          echo "Release assets prepared in 'release_assets' directory:"
          find release_assets -maxdepth 2 -print | sort
        env:
          NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST: ${{ needs.call_get_app_metadata.outputs.is_rust }}
          RELEASE_VERSION: ${{ needs.check_tag.outputs.version }}

      - name: Extract release notes from changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check_tag.outputs.version }}
        run: |
          set -euo pipefail

          awk -v ver="${RELEASE_VERSION}" '
              BEGIN { found=0; target="## [" ver "] - " }
              /^## \[/ {
                if (found) exit
                if (index($0, target) == 1) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "Release notes for ${RELEASE_VERSION} are empty." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.check_tag.outputs.prerelease }}
          RELEASE_VERSION: ${{ needs.check_tag.outputs.version }}
        run: |
          set -euo pipefail

          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${APP_REF_NAME}" --jq '.object.type')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${APP_REF_NAME}" --jq '.object.sha')
          for _ in 1 2 3 4 5; do
            if [ "${tag_type}" = "commit" ]; then
              break
            fi
            if [ "${tag_type}" != "tag" ]; then
              echo "Release tag resolves to unsupported object type: ${tag_type}" >&2
              exit 1
            fi
            tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.type')
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')
          done
          if [ "${tag_type}" != "commit" ] || [ "${tag_sha}" != "${APP_REVISION}" ]; then
            echo "Release tag does not resolve to the validated source commit." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release_assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets are available." >&2
            exit 1
          fi

          release_flags=(
            --verify-tag
            --notes-file release_notes.md
            --title "AgenC Solana v${RELEASE_VERSION}"
          )
          if [ "${IS_PRERELEASE}" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${APP_REF_NAME}" \
            "${release_flags[@]}" \
            "${assets[@]}"
