# Vendored from LedgerHQ/ledger-app-workflows@adb54f0c6a2fa93a7f14764f92ad4d09cc4f192a (v1.106.0).
# External dependencies are locally hardened to immutable revisions.
name: Build and release Ledger application

on:
  workflow_call:
    inputs:
      app_repository:
        description: 'The GIT repository to release (defaults to `github.repository`)'
        required: false
        default: ${{ github.repository }}
        type: string
      app_ref_name:
        description: 'The release version/tag used for validation and artifact names'
        required: false
        default: ${{ github.ref_name }}
        type: string
      app_revision:
        description: 'The immutable GIT commit to build and release'
        required: false
        default: ${{ github.sha }}
        type: string
      builder:
        description: "The allowlisted Ledger builder profile (defaults to ledger-app-builder-lite)"
        required: false
        default: 'ledger-app-builder-lite'
        type: string

env:
  APP_REPOSITORY: ${{ inputs.app_repository }}
  APP_REF_NAME: ${{ inputs.app_ref_name }}
  APP_REVISION: ${{ inputs.app_revision }}
  BUILDER: ${{ inputs.builder }}

permissions:
  contents: read

jobs:
  call_get_app_metadata:
    # This job digests inputs and repository metadata provided by the `ledger_app.toml` manifest
    # file, in order to output relevant directories, compatible devices, and other variables needed
    # by following jobs.
    name: Retrieve application metadata
    uses: ./.github/workflows/_get_app_metadata.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_revision }}

  check-tag:
    name: Check that tag matches last changelog entry (c apps) or cargo.toml version (rust apps)
    needs: call_get_app_metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_revision }}
          persist-credentials: false
      - name: Check tag against changelog or cargo.toml
        shell: bash
        run: |
          if [[ ! "${APP_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Release tag must be an exact x.y.z semantic version." >&2
            exit 1
          fi
          if [[ ! "${APP_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: Release builds require an immutable 40-character commit SHA." >&2
            exit 1
          fi
          if [ "${APP_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
            echo "Error: Releases may only build this repository." >&2
            exit 1
          fi
          if [ "${NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST}" = "false" ]; then
            # For C apps, check that the tag matches the last entry in CHANGELOG.md
            if [ -f CHANGELOG.md ]; then
              LAST_CHANGELOG_VERSION=$(awk '/^## \[/{print $2; exit}' CHANGELOG.md | tr -d '[]')
              if [ "$LAST_CHANGELOG_VERSION" != "${APP_REF_NAME}" ]; then
                echo "Error: The latest version in CHANGELOG.md ($LAST_CHANGELOG_VERSION) does not match the tag being released (${APP_REF_NAME}). Please update CHANGELOG.md."
                exit 1
              fi
            else
              echo "Error: CHANGELOG.md is required for a C application release." >&2
              exit 1
            fi
          else
            # For Rust apps, check that the tag matches the version in Cargo.toml
            if [ -f Cargo.toml ]; then
              CARGO_VERSION=$(awk -F\" '/^version =/{print $2; exit}' Cargo.toml)
              if [ "$CARGO_VERSION" != "${APP_REF_NAME}" ]; then
                echo "Error: The version in Cargo.toml ($CARGO_VERSION) does not match the tag being released (${APP_REF_NAME}). Please update Cargo.toml."
                exit 1
              fi
            else
              echo "Error: Cargo.toml is required for a Rust application release." >&2
              exit 1
            fi
          fi
        env:
          NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST: ${{ needs.call_get_app_metadata.outputs.is_rust }}

  build_app:
    uses: ./.github/workflows/reusable_build.yml
    with:
      app_repository: ${{ inputs.app_repository }}
      app_branch_name: ${{ inputs.app_revision }}
      builder: ${{ inputs.builder }}
      upload_app_binaries_artifact: 'app_binaries'

  release:
    name: Create GitHub release with ELF binaries
    needs: [call_get_app_metadata, check-tag, build_app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required to create the validated tag's GitHub release.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_revision }}
          persist-credentials: false

      - name: Download app binaries artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app_binaries
          path: binaries

      - name: Rename ELF files per device
        run: |
          echo "binaries directory structure:"
          find binaries -maxdepth 4 -print | sort

          mkdir release_assets
          shopt -s nullglob
          device_dirs=(binaries/*)
          if (( ${#device_dirs[@]} == 0 )); then
            echo "No device artifacts were downloaded." >&2
            exit 1
          fi
          for device_dir in "${device_dirs[@]}"; do
            device_name=$(basename "$device_dir")
            if [[ ! "${device_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid device artifact directory: ${device_name}" >&2
              exit 1
            fi
            if [ "${NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST}" = 'false' ]; then
              if [ -f "${device_dir}/bin/app.elf" ]; then
                cp "${device_dir}/bin/app.elf" "release_assets/app-${APP_REF_NAME}-${device_name}.elf"
              fi
            else
              rust_app_path=$(find "binaries/${device_name}/release" -type f ! -name '*.*' -print -quit)
              if [ -n "$rust_app_path" ] && [ -f "$rust_app_path" ]; then
                cp "$rust_app_path" "release_assets/app-${APP_REF_NAME}-${device_name}.elf"
              fi
            fi
          done

          release_assets=(release_assets/*.elf)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No ELF release assets were produced." >&2
            exit 1
          fi

          echo "Release assets prepared in 'release_assets' directory:"
          find release_assets -maxdepth 2 -print | sort
        env:
          NEEDS_CALL_GET_APP_METADATA_OUTPUTS_IS_RUST: ${{ needs.call_get_app_metadata.outputs.is_rust }}

      - name: Extract release notes from changelog
        id: extract_release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            VERSION="${APP_REF_NAME}"
            # Extract the section for this version from CHANGELOG.md
            # Matches from "## [x.y.z]" until the next "## [" or end of file
            NOTES=$(awk -v ver="$VERSION" '
              BEGIN { found=0 }
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md)

            if [ -z "$NOTES" ]; then
              echo "Warning: No changelog entry found for version $VERSION"
              NOTES="Release $VERSION"
            fi

            # Write to file to avoid delimiter issues
            echo "$NOTES" > release_notes.md
          else
            echo "No CHANGELOG.md found, no release message will be added in github release."
            touch release_notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${APP_REF_NAME}" --jq '.object.type')
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${APP_REF_NAME}" --jq '.object.sha')
          for _ in 1 2 3 4 5; do
            if [ "${tag_type}" = "commit" ]; then
              break
            fi
            if [ "${tag_type}" != "tag" ]; then
              echo "Release tag resolves to unsupported object type: ${tag_type}" >&2
              exit 1
            fi
            tag_type=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.type')
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')
          done
          if [ "${tag_type}" != "commit" ] || [ "${tag_sha}" != "${APP_REVISION}" ]; then
            echo "Release tag does not resolve to the validated source commit." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release_assets/*.elf)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets are available." >&2
            exit 1
          fi
          gh release create "${APP_REF_NAME}" \
            --verify-tag \
            --notes-file release_notes.md \
            "${assets[@]}"
