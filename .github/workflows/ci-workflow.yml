name: Compilation & tests

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

permissions:
  contents: read

# Cancel previous runs on this reference
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: ./.github/workflows/reusable_build.yml
    with:
      upload_app_binaries_artifact: compiled_app_binaries
      flags: "TRUSTED_NAME_TEST_KEY=1"
      build_comparison: true
      enable_stack_consumption: true

  standalone_tests:
    name: Run ragger tests using the reusable workflow
    needs: build_application
    uses: ./.github/workflows/reusable_ragger_tests.yml
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: false
      test_dir: "tests/python"
      post_stack_consumption: true

  tests_swap:
    name: Run swap tests using the reusable workflow
    needs: build_application
    uses: ./.github/workflows/reusable_swap_tests.yml
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: false

  update_standalone_snapshots:
    name: Regenerate standalone snapshots
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
    needs: build_application
    permissions:
      contents: write       # Required only for the manually requested snapshot branch.
      pull-requests: write  # Required only to open the snapshot review pull request.
    uses: ./.github/workflows/reusable_ragger_tests.yml
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: true
      test_dir: "tests/python"
      post_stack_consumption: false

  update_swap_snapshots:
    name: Regenerate swap snapshots
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
    needs: build_application
    permissions:
      contents: write       # Required only for the manually requested snapshot branch.
      pull-requests: write  # Required only to open the snapshot review pull request.
    uses: ./.github/workflows/reusable_swap_tests.yml
    with:
      download_app_binaries_artifact: compiled_app_binaries
      regenerate_snapshots: true

  job_C_test:
    name: C tests
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite@sha256:02dfec4a79dd5ea1783c534f8e5f104a82a7492ba49d6dfe0360db8fc3b908b7 # linux/amd64, resolved 2026-07-20
    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Build unit tests
        run: make -C libsol

  build_mem_app:
    name: Build Memory application using the reusable workflow
    uses: ./.github/workflows/reusable_build.yml
    with:
      upload_app_binaries_artifact: "memory_elfs"
      flags: "memory_profiling"
      run_for_devices: '["flex"]'

  ragger_mem_tests:
    name: Run Memory tests using the reusable workflow
    needs: build_mem_app
    uses: ./.github/workflows/reusable_ragger_tests.yml
    with:
      download_app_binaries_artifact: "memory_elfs"
      run_for_devices: '["flex"]'
      upload_snapshots_on_failure: false
      capture_file: pytest-logs-combined

  ragger_mem_results:
    name: Process pytest logs
    if: always()
    needs: ragger_mem_tests
    runs-on: ubuntu-24.04
    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download and process pytest logs
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pytest-logs-combined
          path: logs

      - name: Process logs with valground
        if: always()
        run: |
          if [ -f logs/pytest-logs-combined.log ]; then
            cat logs/pytest-logs-combined.log | tools/valground.py -q
          fi
