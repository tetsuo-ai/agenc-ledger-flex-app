[app]
build_directory = "./"
sdk = "C"
devices = ["nanox", "nanos+", "stax", "flex", "apex_p"]

[use_cases]
trusted_name_test = "TRUSTED_NAME_TEST_KEY=1"
dbg_trusted_name_test = "DEBUG=1 TRUSTED_NAME_TEST_KEY=1"
memory_profiling = "DEBUG=1 TRUSTED_NAME_TEST_KEY=1 MEMORY_PROFILING=1"

[pytest.standalone]
directory = "./tests/python/"

[pytest.swap]
directory = "./tests/swap/"
[pytest.swap.dependencies]
testing_with_latest = [
    {url = "https://github.com/LedgerHQ/app-exchange", ref = "47ee76b1bc5e89286dd2583fefb0dd08e6d742af", use_case = "dbg_use_test_keys"},
    {url = "https://github.com/LedgerHQ/app-ethereum", ref = "07e8f9e5e1ff69046557ff586af33891120eb66c", use_case = "use_test_keys"},
]
