<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="AgenC clear-signing stack: from the marketplace kit down to the Ledger device">
  <rect x="2" y="2" width="756" height="468" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>

  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#18181b">AgenC clear-signing stack</text>
  <text x="380" y="60" text-anchor="middle" font-size="12.5" fill="#71717a">how an AgenC transaction reaches the Ledger secure screen</text>

  <!-- group brackets: host / device -->
  <line x1="50" y1="86" x2="50" y2="290" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="50" y1="306" x2="50" y2="438" stroke="#d4d4d8" stroke-width="2"/>
  <text transform="translate(34,188) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">HOST · NODE</text>
  <text transform="translate(34,372) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#a1a1aa">LEDGER DEVICE</text>

  <!-- L1 -->
  <rect x="72" y="86" width="616" height="58" rx="11" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="96" y="112" font-size="15.5" font-weight="600" fill="#18181b">AgenC Marketplace Kit</text>
  <text x="96" y="131" font-size="12.5" fill="#71717a">Node CLI — builds &amp; policy-checks the Solana transaction</text>

  <!-- L2 -->
  <rect x="72" y="158" width="616" height="58" rx="11" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="96" y="184" font-size="15.5" font-weight="600" fill="#18181b">Ledger Device Management Kit (DMK)</text>
  <text x="96" y="203" font-size="12.5" fill="#71717a">device-signer-kit-solana · or legacy LedgerJS hw-app-solana</text>

  <!-- L3 -->
  <rect x="72" y="230" width="616" height="58" rx="11" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="96" y="256" font-size="15.5" font-weight="600" fill="#18181b">Transport</text>
  <text x="96" y="275" font-size="12.5" fill="#71717a">BLE (noble) · USB-HID</text>

  <!-- host/device boundary -->
  <line x1="72" y1="298" x2="688" y2="298" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- L4 (this repo, accent) -->
  <rect x="72" y="306" width="616" height="62" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="2.2"/>
  <text x="96" y="332" font-size="15.5" font-weight="700" fill="#065f46">AgenC Solana app</text>
  <text x="96" y="351" font-size="12.5" fill="#047857">on-device clear-signing — program id + Anchor discriminator + Borsh, zero host trust</text>
  <rect x="566" y="318" width="98" height="22" rx="11" fill="#10b981"/>
  <text x="615" y="333" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#ffffff">THIS REPO</text>

  <!-- L5 -->
  <rect x="72" y="382" width="616" height="58" rx="11" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="96" y="408" font-size="15.5" font-weight="600" fill="#18181b">Ledger device</text>
  <text x="96" y="427" font-size="12.5" fill="#71717a">Flex · Stax · Nano X · Nano S+ — secure screen + private keys</text>

  <!-- flow arrows on the right -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <path d="M712 96 L712 430"/>
    <path d="M712 430 l-5 -9 M712 430 l5 -9"/>
  </g>
  <text transform="translate(730,263) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1" fill="#10b981">SIGN FLOW</text>
</svg>
